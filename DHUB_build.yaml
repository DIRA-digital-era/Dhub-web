name: DHUB EAS Production Build

on:
  push:
    branches:
      - main # Triggers whenever you push to main

jobs:
  build:
    name: Build & Submit Native Apps
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup Repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Get this from expo.dev -> Access Tokens

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Build & Auto-Submit Android (Google Play)
        run: eas build --platform android --profile production --non-interactive --auto-submit

      - name: 🍎 Build & Auto-Submit iOS (TestFlight)
        # Note: iOS builds are faster on macOS runners, but EAS offloads the heavy lifting to their cloud VMs anyway!
        run: eas build --platform ios --profile production --non-interactive --auto-submit
