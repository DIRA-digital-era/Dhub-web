[build]
  command = "npx expo export --platform web"
  publish = "dist"

# Redirect legacy Netlify domain to production domain
[[redirects]]
  from = "https://dhubweb.netlify.app/*"
  to = "https://dhubweb.diracmr.com/:splat"
  status = 301
  force = true

[[edge_functions]]
  path = "/"
  function = "root-og"

#  Route /listing/* to Netlify Edge Function (instead of redirect)
[[edge_functions]]
  path = "/listing/*"
  function = "listing-og"

#  Keep this – it handles SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

#  Optional: additional headers for edge function responses
# (The edge function already sets its own Cache-Control, so this is redundant)
# [[headers]]
#   for = "/listing/*"
#   [headers.values]
#     Cache-Control = "public, max-age=86400, s-maxage=604800"
#     X-Content-Type-Options = "nosniff"