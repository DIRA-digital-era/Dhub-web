[build]
  command = "npx expo export --platform web"
  publish = "dist"

[[redirects]]
  from = "/listing/*"
  to = "https://lpdszzdmhzrowtppngjb.supabase.co/functions/v1/listing-og?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/listing/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=604800"
    X-Content-Type-Options = "nosniff"